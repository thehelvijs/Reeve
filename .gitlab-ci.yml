# GitLab CI/CD — mirrors .github/workflows (gate + versioned release).
# Versions: server/agent from the VERSION file, UI from web/package.json.
# Not exercised locally (no GitLab runner here); adjust the release publishing
# to your GitLab instance as needed.
stages:
  - gate
  - release

go-gate:
  stage: gate
  image: golang:1.25
  script:
    - go vet ./server/... ./agent/... ./contracts/...
    - go test ./server/... ./agent/... ./contracts/...
    - apt-get update && apt-get install -y shellcheck >/dev/null
    - shellcheck deploy/install.sh deploy/uninstall.sh deploy/test_install.sh
    - bash deploy/test_install.sh

web-gate:
  stage: gate
  image: node:20
  script:
    - cd web
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - web/dist
    expire_in: 1 day

# Tag a release as v<VERSION> (e.g. v0.0.1-alpha) to build versioned agent
# binaries for every arch plus the install scripts.
release:
  stage: release
  image: golang:1.25
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - apt-get update && apt-get install -y python3 >/dev/null
    - python3 scripts/release.py --release --version "$(cat VERSION)"
  artifacts:
    paths:
      - dist/agent-linux-*
      - dist/SHA256SUMS
      - dist/install.sh
      - dist/uninstall.sh
