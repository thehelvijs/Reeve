# Reeve, whole. One `up -d` gives the server, an agent for the machine it runs
# on, and the updater that keeps both on the channel picked in the UI.
#
# LAN-only: this listens on every interface, so keep it behind your firewall, or
# narrow it with REEVE_BIND=192.168.1.10.
#
# The images come from ghcr, so `docker login ghcr.io` first while the package is
# private. To build from this checkout instead:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml up -d --build
services:
  server:
    image: ${REEVE_IMAGE:-ghcr.io/thehelvijs/reeve:latest}
    # The tag stays put while its digest moves, so a plain `up -d` has to check
    # for a new one rather than reuse whatever is cached.
    pull_policy: always
    # The server reaches hosts by their .local name over mDNS, and multicast out
    # of a bridge network stops at the bridge. Host networking is what makes
    # "Install over SSH" work with the names the machines answer to.
    network_mode: host
    environment:
      # Every interface by default: the team reaches this over the LAN, and on
      # the host network a loopback bind would need REEVE_BIND set before the
      # first `up -d` is useful at all. Narrow it with REEVE_BIND=192.168.1.10.
      # The port is overridable so a second instance can run alongside one that
      # already holds 7338.
      REEVE_ADDR: ${REEVE_BIND:-0.0.0.0}:${REEVE_PORT:-7338}
      # Required. Generate once: openssl rand -base64 32
      REEVE_MASTER_KEY: ${REEVE_MASTER_KEY:?set REEVE_MASTER_KEY in .env}
      # The URL people reach this server on. Optional: it defaults to the host
      # each request arrives on. Set it for Google sign-in, or when the
      # browser-facing address is not the one agents should push to.
      REEVE_PUBLIC_URL: ${REEVE_PUBLIC_URL:-}
      # Set to true when a reverse proxy terminates HTTPS in front of this.
      REEVE_COOKIE_SECURE: ${REEVE_COOKIE_SECURE:-false}
      # The updater below watches this deployment. The server cannot see it —
      # it has no Docker socket — so the deploy says so, and Settings reports
      # whether switching a channel actually leads anywhere.
      REEVE_SELF_UPDATE: "true"
    volumes:
      - reeve-data:/data
    restart: unless-stopped

  # The machine running Reeve is a host like any other, so it gets an agent like
  # any other. It enrols itself: the server writes a token for its own host row
  # into the data volume, and this reads it from there, so there is nothing to
  # paste and no secret in .env.
  #
  # Host networking to reach the server on the port it bound, and because the
  # metrics it reports should be the machine's, not a bridge's.
  agent:
    image: ${REEVE_AGENT_IMAGE:-ghcr.io/thehelvijs/reeve-agent:latest}
    pull_policy: always
    network_mode: host
    environment:
      REEVE_SERVER_URL: http://127.0.0.1:${REEVE_PORT:-7338}
      REEVE_AGENT_TOKEN_FILE: /state/self-agent-token
      # This agent is part of the deploy, not of the fleet rollout: it is
      # replaced by repulling or rebuilding its image, and a self-update would
      # be undone by the next `up -d`.
      REEVE_AUTO_UPDATE: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Only for the token file; the rest of the volume is the database.
      - reeve-data:/state:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Re-runs `up -d` on a timer with the channel's tag substituted in, so one loop
  # covers both jobs: a new digest on the current channel, and a channel an admin
  # switched in the UI. Compose does nothing when neither moved, which is the
  # common case.
  #
  # This exists because a container cannot replace itself: the server cannot
  # recreate the container it is running in, whatever it is allowed to do. So the
  # job goes to a container with no network surface, and the Docker socket — root
  # on this host — stays out of the one serving HTTP.
  updater:
    image: docker:28-cli
    environment:
      REEVE_UPDATE_POLL_SECS: ${REEVE_UPDATE_POLL_SECS:-3600}
      REEVE_IMAGE_REPO: ${REEVE_IMAGE_REPO:-ghcr.io/thehelvijs/reeve}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose files and .env this project was started from: the updater
      # recreates the containers from the same spec rather than a copy of it.
      - ./:/deploy:ro
      # Read-only, and only for update-channel: the server owns that file, and
      # the rest of the volume is the database.
      - reeve-data:/state:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        # The project name this container was started under. Guessing it wrong
        # would start a *second* server on the same host port instead of
        # replacing this one, so it is read from our own labels, not configured.
        project=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$(hostname)")
        if [ -z "$$project" ]; then
          echo "updater: cannot determine the compose project; refusing to guess" >&2
          exit 1
        fi
        echo "updater: watching project $$project every $$REEVE_UPDATE_POLL_SECS s"
        while :; do
          tag=$$(cat /state/update-channel 2>/dev/null | tr -d '[:space:]')
          # Only tags this project publishes. The file is written by the server
          # from a fixed map, so anything else means a hand-edited volume.
          case "$$tag" in
            latest|develop|main) ;;
            *) tag=latest ;;
          esac
          REEVE_IMAGE="$$REEVE_IMAGE_REPO:$$tag" \
          REEVE_AGENT_IMAGE="$$REEVE_IMAGE_REPO-agent:$$tag" docker compose \
            --project-name "$$project" \
            --project-directory /deploy \
            -f /deploy/docker-compose.yml \
            up -d server agent ||
            echo "updater: up -d failed; staying on the running build" >&2
          sleep "$$REEVE_UPDATE_POLL_SECS"
        done
    restart: unless-stopped

volumes:
  reeve-data: {}
