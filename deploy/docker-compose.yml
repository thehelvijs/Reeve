# Reeve server, built from this checkout. Nothing is pulled from a registry.
# LAN-only: this listens on every interface, so keep it behind your firewall, or
# narrow it with REEVE_BIND=192.168.1.10.
#
# To run a published image instead of building, use the pull override:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.pull.yml up -d
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      secrets:
        - signing_key
    image: reeve:source
    # The server reaches hosts by their .local name over mDNS, and multicast out
    # of a bridge network stops at the bridge. Host networking is what makes
    # "Install over SSH" work with the names the machines answer to.
    network_mode: host
    environment:
      # Every interface by default: the team reaches this over the LAN, and on
      # the host network a loopback bind would need REEVE_BIND set before the
      # first `up -d` is useful at all. Narrow it with REEVE_BIND=192.168.1.10.
      # The port is overridable so a second instance can run alongside one that
      # already holds 7338.
      REEVE_ADDR: ${REEVE_BIND:-0.0.0.0}:${REEVE_PORT:-7338}
      # Required. Generate once: openssl rand -base64 32
      REEVE_MASTER_KEY: ${REEVE_MASTER_KEY:?set REEVE_MASTER_KEY in .env}
      # The URL people reach this server on. Optional: it defaults to the host
      # each request arrives on. Set it for Google sign-in, or when the
      # browser-facing address is not the one agents should push to.
      REEVE_PUBLIC_URL: ${REEVE_PUBLIC_URL:-}
      # Set to true when a reverse proxy terminates HTTPS in front of this.
      REEVE_COOKIE_SECURE: ${REEVE_COOKIE_SECURE:-false}
    volumes:
      - reeve-data:/data
    restart: unless-stopped

  # The machine running Reeve is a host like any other, so it gets an agent like
  # any other. It enrols itself: the server writes a token for its own host row
  # into the data volume, and this reads it from there, so there is nothing to
  # paste and no secret in .env.
  #
  # Host networking to reach the server on the port it bound, and because the
  # metrics it reports should be the machine's, not a bridge's.
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    image: reeve-agent:source
    network_mode: host
    environment:
      REEVE_SERVER_URL: http://127.0.0.1:${REEVE_PORT:-7338}
      REEVE_AGENT_TOKEN_FILE: /state/self-agent-token
      # This agent is part of the deploy, not of the fleet rollout: it is
      # replaced by rebuilding or repulling its image, and a self-update would
      # be undone by the next `up -d`.
      REEVE_AUTO_UPDATE: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Only for the token file; the rest of the volume is the database.
      - reeve-data:/state:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reeve-data: {}

secrets:
  # Only reaches the build, never the running container. Unset means the
  # embedded agents go out unsigned and hosts refuse to self-update from here.
  signing_key:
    environment: REEVE_SIGNING_KEY
