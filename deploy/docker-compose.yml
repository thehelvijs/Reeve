# Reeve server, built from this checkout. Nothing is pulled from a registry.
# LAN-only: in production bind the port to a LAN interface, e.g.
# "192.168.1.10:8080:8080", not 0.0.0.0.
#
# To run a published image instead of building, use the pull override:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.pull.yml up -d
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: reeve:source
    ports:
      # Bound to loopback by default so a fresh `up -d` is never reachable from
      # the network by accident. Set REEVE_BIND to the LAN address the team
      # reaches this on, e.g. REEVE_BIND=192.168.1.10. The port is overridable
      # so a second instance can run alongside one that already holds 8080.
      - "${REEVE_BIND:-127.0.0.1}:${REEVE_PORT:-8080}:8080"
    environment:
      # Required. Generate once: openssl rand -base64 32
      REEVE_MASTER_KEY: ${REEVE_MASTER_KEY:?set REEVE_MASTER_KEY in .env}
      # The URL people reach this server on. Required for Google sign-in and
      # used in emailed links and the agent enrollment command.
      REEVE_PUBLIC_URL: ${REEVE_PUBLIC_URL:-}
      # Set to true when a reverse proxy terminates HTTPS in front of this.
      REEVE_COOKIE_SECURE: ${REEVE_COOKIE_SECURE:-false}
    volumes:
      - reeve-data:/data
    restart: unless-stopped

volumes:
  reeve-data: {}
