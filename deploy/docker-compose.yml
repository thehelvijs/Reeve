# Reeve server, built from this checkout. Nothing is pulled from a registry.
# LAN-only: this listens on every interface, so keep it behind your firewall, or
# narrow it with REEVE_BIND=192.168.1.10.
#
# To run a published image instead of building, use the pull override:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.pull.yml up -d
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: reeve:source
    # The server reaches hosts by their .local name over mDNS, and multicast out
    # of a bridge network stops at the bridge. Host networking is what makes
    # "Install over SSH" work with the names the machines answer to.
    network_mode: host
    environment:
      # Every interface by default: the team reaches this over the LAN, and on
      # the host network a loopback bind would need REEVE_BIND set before the
      # first `up -d` is useful at all. Narrow it with REEVE_BIND=192.168.1.10.
      # The port is overridable so a second instance can run alongside one that
      # already holds 8080.
      REEVE_ADDR: ${REEVE_BIND:-0.0.0.0}:${REEVE_PORT:-8080}
      # Required. Generate once: openssl rand -base64 32
      REEVE_MASTER_KEY: ${REEVE_MASTER_KEY:?set REEVE_MASTER_KEY in .env}
      # The URL people reach this server on. Optional: it defaults to the host
      # each request arrives on. Set it for Google sign-in, or when the
      # browser-facing address is not the one agents should push to.
      REEVE_PUBLIC_URL: ${REEVE_PUBLIC_URL:-}
      # Set to true when a reverse proxy terminates HTTPS in front of this.
      REEVE_COOKIE_SECURE: ${REEVE_COOKIE_SECURE:-false}
    volumes:
      - reeve-data:/data
    restart: unless-stopped

volumes:
  reeve-data: {}
