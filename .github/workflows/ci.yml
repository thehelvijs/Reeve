name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
# The gate only reads the checkout; a fork's PR gets nothing more.
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Go vet + test
        run: |
          go vet ./server/... ./agent/... ./contracts/...
          go test ./server/... ./agent/... ./contracts/...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Web typecheck, lint, build
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web run test
          npm --prefix web run build
      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck minisign
          shellcheck deploy/install.sh deploy/uninstall.sh deploy/test_install.sh
      - name: Shell unit tests
        run: bash deploy/test_install.sh
      - name: Python release tests
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest scripts/ -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install web deps
        run: npm --prefix web ci
      - name: Install Playwright browser
        run: npx --prefix web playwright install --with-deps chromium chrome
      - name: Playwright e2e
        run: npm --prefix web run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
