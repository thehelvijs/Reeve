name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Go vet + test
        run: |
          go vet ./server/... ./agent/... ./contracts/...
          go test ./server/... ./agent/... ./contracts/...
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Web typecheck, lint, build
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web run build
      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck minisign
          shellcheck deploy/install.sh deploy/uninstall.sh deploy/test_install.sh
      - name: Shell unit tests
        run: bash deploy/test_install.sh
      - name: Python release tests
        run: |
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest scripts/ -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web deps
        run: npm --prefix web ci
      - name: Install Playwright browser
        run: npx --prefix web playwright install --with-deps chromium chrome
      - name: Playwright e2e
        run: npm --prefix web run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
