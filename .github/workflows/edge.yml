name: edge
on:
  push:
    branches: [develop, main]
permissions:
  contents: write
  packages: write
env:
  IMAGE: ghcr.io/thehelvijs/reeve
  # Without this secret the build still succeeds, but artifacts go out unsigned
  # and deployed agents refuse to self-update to them.
  REEVE_SIGNING_KEY: ${{ secrets.REEVE_SIGNING_KEY }}
jobs:
  build-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build all-arch agent
        run: python3 scripts/release.py --release --commit "${GITHUB_SHA::7}"
      - name: Build the UI and stage embedded assets
        run: |
          make web-build
          make server-assets
      - name: Build server binaries
        run: python3 scripts/release.py --server --commit "${GITHUB_SHA::7}"
      - name: Publish rolling edge release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: edge
          prerelease: true
          files: |
            dist/agent-linux-*
            dist/server-linux-*
            dist/SHA256SUMS
            dist/install.sh
            dist/uninstall.sh

  publish-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ github.sha }}
          tags: ${{ env.IMAGE }}:edge
          secrets: |
            signing_key=${{ secrets.REEVE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
